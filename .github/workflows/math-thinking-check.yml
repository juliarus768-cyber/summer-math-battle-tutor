name: Math Thinking Check

on:
  pull_request:
    paths:
      - 'math-secrets.js'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/math-thinking-check.yml'
  push:
    branches:
      - agent/add-math-secrets

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: node --check math-secrets.js

      - name: Production build
        run: npm run build

      - name: Verify Math Thinking script was injected
        run: |
          test -f dist/index.html
          grep -q 'math-secrets.js' dist/index.html
